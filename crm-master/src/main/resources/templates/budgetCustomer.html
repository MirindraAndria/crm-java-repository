<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:insert="~{/general/head.html}"></div>
<meta name="_csrf" content="${_csrf.token}"/>
<meta name="_csrf_header" content="${_csrf.headerName}"/>

<!-- Editable CSS -->
<link rel="stylesheet" type="text/css"
      th:href="@{/css/dataTables.bootstrap4.css}">
<link rel="stylesheet" type="text/css"
      th:href="@{/css/responsive.dataTables.min.css}">
<!-- wysihtml5 CSS -->

<link th:href="@{/css/tagify.css}" rel="stylesheet" type="text/css" />
<!--    <link  />-->
<link rel="stylesheet" th:href="@{/css/bootstrap-wysihtml5.css}"/>
<!-- Custom CSS -->
<link th:href="@{/css/style.min.css}" rel="stylesheet">
<!-- page css -->
<link th:href="@{/css/pages/inbox.css}" rel="stylesheet">

<!-- HTML5 Shim and Respond.js IE8 support of HTML5 elements and media queries -->
<!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
<!--[if lt IE 9]>
<script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
<script src="https://oss.maxcdn.com/libs/respond.js/1.4.2/respond.min.js"></script>
<![endif]-->
</head>

<body class="skin-blue fixed-layout">
<!-- ============================================================== -->
<!-- Preloader - style you can find in spinners.css -->
<!-- ============================================================== -->
<div class="preloader">
    <div class="loader">
        <div class="loader__figure"></div>
        <p class="loader__label">CRM</p>
    </div>
</div>
<!-- ============================================================== -->
<!-- Main wrapper - style you can find in pages.scss -->
<!-- ============================================================== -->
<div id="main-wrapper">
    <!-- ============================================================== -->
    <!-- Topbar header - style you can find in pages.scss -->
    <!-- ============================================================== -->
    <div th:insert="~{/general/header.html}"></div>
    <!-- ============================================================== -->
    <!-- End Topbar header -->
    <!-- ============================================================== -->
    <!-- ============================================================== -->
    <!-- Left Sidebar - style you can find in sidebar.scss  -->
    <!-- ============================================================== -->
    <div th:insert="~{/general/left-sidebar.html}"></div>
    <!-- ============================================================== -->
    <!-- End Left Sidebar - style you can find in sidebar.scss  -->
    <!-- ============================================================== -->
    <!-- ============================================================== -->
    <!-- Page wrapper  -->
    <!-- ============================================================== -->
    <div class="page-wrapper">
        <!-- ============================================================== -->
        <!-- Container fluid  -->
        <!-- ============================================================== -->
        <div class="container-fluid">
    
            <div th:insert="~{/general/page-titles.html}"></div>
 
            <div class="row">
                <div class="col-md-6">
                    <div>
                        <div class="card">
                            <div class="card-body">
                                <h4 class="card-title">Add budget customer</h4>

                                        <form th:action="@{/addBudgetCustomer}" method="post">
                                            <!-- Sélection du client -->
                                            <div class="mb-3">
                                                <label for="customer" class="form-label">Select Customer:</label>
                                                <select class="form-control" id="customer" name="idCustomer" required>
                                                    <option value="">-- Select a Customer --</option>
                                                    <option th:if="${customer != null}" th:each="customer : ${customers}" 
                                                            th:value="${customer.customerId}" 
                                                            th:text="${customer.name}">
                                                    </option>
                                                </select>
                                            </div>

                                            <!-- <div class="mb-3">
                                                <label for="user" class="form-label">Assign Employee:</label>
                                                <select class="form-control" id="user" name="idUser" required>
                                                    <option value="">-- Select a user --</option>
                                                    <option th:if="${user != null}" th:each="user : ${users}" 
                                                            th:value="${user.id}" 
                                                            th:text="${user.username}">
                                                    </option>
                                                </select>
                                            </div> -->
                        
                                            <!-- Champ libellé -->
                                            <div class="mb-3">
                                                <label for="libelle" class="form-label">Libelle:</label>
                                                <input type="text" class="form-control" id="libelle" name="libelle" required>
                                            </div>
                        
                                            <!-- Champ montant -->
                                            <div class="mb-3">
                                                <label for="amount" class="form-label">Amount:</label>
                                                <input type="number" step="0.01" class="form-control" id="amount" name="amount" required>
                                            </div>
                        
                                            <!-- Champ date -->
                                            <div class="mb-3">
                                                <label for="dateBudget" class="form-label">Budget Date:</label>
                                                <input type="date" class="form-control" id="dateBudget" name="dateBudget" required>
                                            </div>
                        
                                            <!-- Bouton d'envoi -->
                                            <button type="submit" class="btn btn-primary">Save Budget</button>
                                        </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- END MODAL -->
            <!-- ============================================================== -->
            <!-- End Page Content -->
            <!-- ============================================================== -->
            <!-- ============================================================== -->
            <!-- Right sidebar -->
            <!-- ============================================================== -->
            <!-- .right-sidebar -->
            <div th:insert="~{/general/right-sidebar.html}"></div>
            <!-- ============================================================== -->
            <!-- End Right sidebar -->
            <!-- ============================================================== -->
        </div>
        <!-- ============================================================== -->
        <!-- End Container fluid  -->
        <!-- ============================================================== -->
    </div>
    <!-- ============================================================== -->
    <!-- End Page wrapper  -->
    <!-- ============================================================== -->
    <!-- ============================================================== -->
    <!-- footer -->
    <!-- ============================================================== -->
    <div th:insert="~{/general/footer.html}"></div>
    <!-- ============================================================== -->
    <!-- End footer -->
    <!-- ============================================================== -->
</div>
<!-- ============================================================== -->
<!-- End Wrapper -->
<!-- ============================================================== -->
<!-- ============================================================== -->
<!-- All Jquery -->
<!-- ============================================================== -->
<script th:inline="javascript">
    var home = /*[[${home}]]*/ null;
</script>
<script th:src="@{/js/library/jquery-3.2.1.min.js}" type="text/javascript"></script>
<!--    &lt;!&ndash; Bootstrap tether Core JavaScript &ndash;&gt;-->
<script th:src="@{/js/library/popper.min.js}" type="text/javascript"></script>
<script th:src="@{/js/library/bootstrap.min.js}" type="text/javascript"></script>
<!--    &lt;!&ndash; slimscrollbar scrollbar JavaScript &ndash;&gt;-->
<script th:src="@{/js/library/perfect-scrollbar.jquery.min.js}" type="text/javascript">></script>
<!--Wave Effects -->
<script th:src="@{/js/library/waves.js}" type="text/javascript"></script>
<!--Menu sidebar -->
<script th:src="@{/js/library/sidebarmenu.js}" type="text/javascript"></script>
<!--stickey kit -->
<script th:src="@{/js/library/sticky-kit.min.js}"></script>
<script th:src="@{/js/library/jquery.sparkline.min.js}" type="text/javascript"></script>
<!--Custom JavaScript -->
<script th:src="@{/js/library/custom.min.js}" type="text/javascript"></script>
<script  th:src="@{/js/library/jquery-ui.min.js}"></script>

</body>

</html>
